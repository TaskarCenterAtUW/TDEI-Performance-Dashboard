name: Azure Static Web Apps CI/CD - STAGE

on:
  push:
    branches:
      - stage
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    environment: Stage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Build Application
        run: |
          cd tdei-dashboard
          touch .env
          echo REACT_APP_BASE_URL=${{ secrets.REACT_APP_BASE_URL }} >> .env
          echo REACT_APP_ENCRYPTED_KEY=${{ secrets.REACT_APP_ENCRYPTED_KEY }} >> .env
          echo REACT_APP_PKI=${{ secrets.REACT_APP_PKI }} >> .env
          echo REACT_APP_PROJECT_GROUP=${{ secrets.REACT_APP_PROJECT_GROUP }} >> .env
          echo CI=false >> .env
          npm i --legacy-peer-deps
          CI=false npm run build --if-present
          npm run cp:config

      - name: Build and Deploy to Azure
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEBAPP_TOKEN_STAGE }}
          action: "upload"
          app_location: "tdei-dashboard/build"
          output_location: "tdei-dashboard/build"
          skip_app_build: true
          production_branch: 'stage'
